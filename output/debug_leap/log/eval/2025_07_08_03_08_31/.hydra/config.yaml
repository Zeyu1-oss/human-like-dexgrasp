skip: true
n_worker: 48
setting: fc
exp_name: debug
save_root: output
save_dir: ${save_root}/${exp_name}_${hand_name}
grasp_dir: ${save_dir}/graspdata
eval_dir: ${save_dir}/evaluation
succ_dir: ${save_dir}/succgrasp
succ_cpoint: ${save_dir}/succpoint
collect_dir: ${save_dir}/succ_collect
vusd_dir: ${save_dir}/vis_usd
vobj_dir: /media/rose/KINGSTON/obj/vis_obj
data_struct:
- '**'
- '**'
- '**.npy'
log_dir: ${save_dir}/log/${task_name}/${now:%Y_%m_%d_%H_%M_%S}
task_name: ${hydra:runtime.choices.task}
hand_name: ${hydra:runtime.choices.hand}
task:
  max_num: -1
  obj_mass: 0.03
  miu_coef:
  - 0.6
  - 0.02
  debug_render: false
  debug_viewer: false
  debug_dir: ${save_dir}/debug
  simulation_metrics:
    max_pene: 0.01
    trans_thre: 0.05
    angle_thre: 30
  min_contact_num: 14
  analytic_fc_metrics:
    contact_tip_only: true
    contact_threshold: 0.005
    type:
    - qp
    - qp_dfc
    - q1
    - tdg
    - dfc
  pene_contact_metrics:
    contact_margin: 0.01
    contact_threshold: 0.005
  debug_mode: false
hand:
  xml_path: assets/hand/leap/right_hand.xml
  mocap: true
  exclude_table_contact: null
  color:
  - 0.132868
  - 0.496933
  - 0.144129
  - 1.0
  finger_prefix:
  - if
  - mf
  - rf
  - th
  valid_body_name:
  - palm
  - if_px
  - if_md
  - if_ds
  - mf_px
  - mf_md
  - mf_ds
  - rf_px
  - rf_md
  - rf_ds
  - th_px
  - th_md
  - th_ds
  tip_body_name:
  - if_ds
  - mf_ds
  - rf_ds
  - th_ds
