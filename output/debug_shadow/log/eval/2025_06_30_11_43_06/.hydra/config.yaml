skip: true
n_worker: 48
setting: fc
exp_name: debug
save_root: output
save_dir: ${save_root}/${exp_name}_${hand_name}
grasp_dir: ${save_dir}/graspdata
eval_dir: ${save_dir}/evaluation
succ_dir: ${save_dir}/succgrasp
succ_cpoint: ${save_dir}/succpoint
collect_dir: ${save_dir}/succ_collect
vusd_dir: ${save_dir}/vis_usd
vobj_dir: /media/rose/KINGSTON/obj/vis_obj
data_struct:
- '**'
- '**'
- '**.npy'
log_dir: ${save_dir}/log/${task_name}/${now:%Y_%m_%d_%H_%M_%S}
task_name: ${hydra:runtime.choices.task}
hand_name: ${hydra:runtime.choices.hand}
task:
  max_num: -1
  obj_mass: 0.03
  miu_coef:
  - 0.6
  - 0.02
  debug_render: false
  debug_viewer: false
  debug_dir: ${save_dir}/debug
  simulation_metrics:
    max_pene: 0.01
    trans_thre: 0.05
    angle_thre: 5
  min_contact_num: 5
  analytic_fc_metrics:
    contact_tip_only: true
    contact_threshold: 0.005
    type:
    - qp
    - qp_dfc
    - q1
    - tdg
    - dfc
  pene_contact_metrics:
    contact_margin: 0.01
    contact_threshold: 0.01
  debug_mode: false
hand:
  xml_path: assets/hand/shadow/right_hand.xml
  mocap: true
  exclude_table_contact: null
  color:
  - 0.863157
  - 0.0865002
  - 0.0802199
  - 1.0
  finger_prefix:
  - rh_ff
  - rh_mf
  - rh_rf
  - rh_lf
  - rh_th
  valid_body_name:
  - rh_palm
  - rh_ffproximal
  - rh_ffmiddle
  - rh_ffdistal
  - rh_mfproximal
  - rh_mfmiddle
  - rh_mfdistal
  - rh_rfproximal
  - rh_rfmiddle
  - rh_rfdistal
  - rh_lfmetacarpal
  - rh_lfproximal
  - rh_lfmiddle
  - rh_lfdistal
  - rh_thproximal
  - rh_thmiddle
  - rh_thdistal
  tip_body_name:
  - rh_ffdistal
  - rh_mfdistal
  - rh_rfdistal
  - rh_lfdistal
  - rh_thdistal
